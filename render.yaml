services:
  # Backend API
  - type: web
    name: biblioteca-api
    env: python
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SERVICE
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      # Instancia de Redis administrada por Render (Key Value) o addon externo;
      # pegar aquí la connection string que Render genera para ese servicio.
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://biblioteca-frontend.onrender.com

  # Frontend estático
  - type: web
    name: biblioteca-frontend
    env: static
    buildCommand: ""
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
