# El servicio `db` (Oracle XE en contenedor) esta deshabilitado a proposito.
# El backend se conecta a Oracle Autonomous Database (cloud.oracle.com) usando
# el descriptor TCPS de la variable DB_DSN, que se toma del archivo .env de la
# raiz del proyecto (junto con DB_USER / DB_PASSWORD). Para volver a un Oracle
# local basta con vaciar DB_DSN y definir DB_HOST/DB_PORT/DB_SERVICE en .env.
services:
  redis:
    image: redis:7-alpine
    container_name: biblioteca-redis
    # Sin `ports:` a propósito: el backend le habla por la red interna de
    # Docker (host `redis`, puerto 6379 dentro del compose network), no
    # necesita publicarse en el host — y publicarlo chocaría con cualquier
    # otro Redis local en el 6379 (ej. de otro proyecto).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: biblioteca-backend
    environment:
      # Credenciales y DSN se toman del .env de la raiz (no se hardcodean aqui).
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DSN: ${DB_DSN:-}
      # Fallback a Oracle local si DB_DSN esta vacia:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-1521}
      DB_SERVICE: ${DB_SERVICE:-XEPDB1}
      SECRET_KEY: ${SECRET_KEY:-cambiar_esta_clave_en_produccion}
      ALLOWED_ORIGINS: http://localhost:5501,http://127.0.0.1:5501,http://localhost:5000,http://127.0.0.1:5000
      PORT: "5000"
      ENV: development
      REDIS_URL: redis://redis:6379/0
      SESSION_IDLE_TTL_SECONDS: "1800"
      SESSION_ABSOLUTE_TTL_SECONDS: "604800"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: biblioteca-frontend
    # Host 5501 en vez de 5500: el 5500 lo ocupa el listener XDB de la
    # instancia Oracle local (ver nota junto al servicio `db` mas arriba).
    ports:
      - "5501:80"
    depends_on:
      - backend
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.52.7
    container_name: biblioteca-metabase
    environment:
      MB_SITE_NAME: Biblioteca Analytics
      # Metabase NO trae el driver JDBC de Oracle; los .jar van en
      # ./metabase/plugins (ver metabase/plugins/README.md) y se montan
      # como volumen de solo lectura.
      MB_PLUGINS_DIR: /plugins
    ports:
      - "3000:3000"
    volumes:
      - ./metabase/plugins:/plugins:ro
    # Metabase se conecta directamente a Oracle Autonomous Database (misma base
    # que el backend); configurar la conexión desde su UI con el descriptor de
    # DB_DSN. Ya no depende de un servicio `db` local.
    restart: unless-stopped
