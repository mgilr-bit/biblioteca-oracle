# El servicio `db` (Oracle XE en contenedor) esta deshabilitado a proposito:
# esta maquina ya tiene una instancia local de Oracle XE 21c (tnslsnr.exe)
# escuchando en 1521/5500 con el esquema `biblioteca_user` ya creado. El
# backend se conecta a ese Oracle local via host.docker.internal (ver
# DB_HOST mas abajo). Si se necesita volver al Oracle en contenedor, restaurar
# este servicio desde el historial de git y quitar el override de DB_HOST.
services:
  redis:
    image: redis:7-alpine
    container_name: biblioteca-redis
    # Sin `ports:` a propósito: el backend le habla por la red interna de
    # Docker (host `redis`, puerto 6379 dentro del compose network), no
    # necesita publicarse en el host — y publicarlo chocaría con cualquier
    # otro Redis local en el 6379 (ej. de otro proyecto).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: biblioteca-backend
    environment:
      DB_USER: biblioteca_user
      DB_PASSWORD: BiblioPass123
      DB_HOST: host.docker.internal
      DB_PORT: "1521"
      DB_SERVICE: XEPDB1
      SECRET_KEY: ${SECRET_KEY:-cambiar_esta_clave_en_produccion}
      ALLOWED_ORIGINS: http://localhost:5501,http://127.0.0.1:5501,http://localhost:5000,http://127.0.0.1:5000
      PORT: "5000"
      ENV: development
      REDIS_URL: redis://redis:6379/0
      SESSION_IDLE_TTL_SECONDS: "1800"
      SESSION_ABSOLUTE_TTL_SECONDS: "604800"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: biblioteca-frontend
    # Host 5501 en vez de 5500: el 5500 lo ocupa el listener XDB de la
    # instancia Oracle local (ver nota junto al servicio `db` mas arriba).
    ports:
      - "5501:80"
    depends_on:
      - backend
    restart: unless-stopped
