server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CORRECCIÓN: la config original usaba `try_files $uri $uri/ =404`,
    # correcta para páginas .html sueltas pero incompatible con una SPA que
    # usa Vue Router en modo "history" (createWebHistory). Con =404, recargar
    # la página en /libros o /usuarios directamente rompía. Ahora cualquier
    # ruta desconocida cae a index.html y el router de Vue decide la vista.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
